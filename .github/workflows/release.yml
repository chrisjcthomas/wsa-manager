name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:build
      - uses: actions/upload-artifact@v4
        with:
          name: wsa-manager-release
          path: |
            release/WSA Manager Setup *.exe
            release/WSA Manager Setup *.exe.blockmap
            release/build-manifest.json

